<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0A0A0A">
  <title>KING SHRYAN – شريان الملك</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/player.css">
  <link rel="stylesheet" href="css/themes.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="header-top">
      <h1 id="app-title">👑 KING SHRYAN</h1>
      <button id="limits-btn" onclick="showLimits()">📊</button>
    </div>
    <p class="subtitle">شريان الملك</p>
    <input type="text" id="search" placeholder="ابحث عن أغنية أو فنان...">
  </header>

  <main>
    <div id="limits-panel" class="limits-panel hidden">
      <h2>📊 حدود الاستخدام</h2>
      <div id="limits-content"></div>
    </div>

    <div id="songs-list"></div>
  </main>

  <footer>
    <div id="player" class="player hidden">
      <div class="player-header">
        <img id="player-cover" src="icons/default-cover.png" alt="غلاف">
        <div class="player-info">
          <h3 id="now-playing">اختر أغنية</h3>
          <p id="now-artist">KING SHRYAN</p>
        </div>
      </div>
      <div class="progress-container">
        <span id="current-time">0:00</span>
        <input type="range" id="progress-bar" value="0" min="0" max="100">
        <span id="duration">0:00</span>
      </div>
      <div class="controls">
        <button id="shuffle-btn" onclick="toggleShuffle()">🔀</button>
        <button id="prev-btn" onclick="player.prev()">⏮</button>
        <button id="play-btn" onclick="togglePlay()">▶</button>
        <button id="next-btn" onclick="player.next()">⏭</button>
        <button id="repeat-btn" onclick="toggleRepeat()">🔁</button>
      </div>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
