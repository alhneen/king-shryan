name: Build KING SHRYAN APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix app icon filename
        run: |
          if [ -f android/app/src/main/res/drawable/app_icon.jpg.jpg ]; then
                    rm -f android/app/src/main/res/drawable/5789588938778415445.jpg
            mv android/app/src/main/res/drawable/app_icon.jpg.jpg android/app/src/main/res/drawable/app_icon.jpg
          fi
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android assembleDebug

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: KING SHRYAN - Latest APK
          target_commitish: ${{ github.sha }}
          body: Latest automatically built KING SHRYAN Android APK.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
